name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Encontrar o projeto
        id: proj
        run: |
          G=$(find . -name gradlew | head -n 1)
          if [ -z "$G" ]; then
            echo "gradlew NAO encontrado. Arquivos do repositorio:"
            ls -R | head -80
            exit 1
          fi
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: ${{ steps.proj.outputs.dir }}

      - name: Compilar o APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renomear o APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Estante-2.4.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Estante-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/Estante-2.4.apk
